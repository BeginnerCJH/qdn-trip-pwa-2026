name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app.js"
      - "index.html"
      - "styles.css"
      - "trip-data.js"
      - "sw.js"
      - "manifest.webmanifest"
      - "icon-*.png"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor dependencies
        run: npm install

      - name: Prepare web assets
        shell: bash
        run: |
          rm -rf www android resources
          mkdir -p www resources
          cp index.html app.js styles.css trip-data.js sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png www/
          cp icon-512.png resources/icon.png

      - name: Create Android project
        run: npx cap add android

      - name: Apply app icon and sync web assets
        run: |
          npx @capacitor/assets generate --android
          npx cap sync android

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qdn-trip-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
